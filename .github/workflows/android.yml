name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# contents:write lets the `gh release create` step publish the signed APK as a Release asset
# (a raw .apk download with no artifact-zip wrapping). All other permissions default to none.
permissions:
  contents: write

# Do not let extra CI runs pile up on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"
      # Secrets are mapped to env vars ONCE at the job level. Step `if:` conditions then check
      # `env.X` (NOT `secrets.X` -- the secrets context is not available in step if-conditionals
      # in all GitHub Actions validation paths), and run-scripts read `$X` instead of interpolating
      # `${{ secrets.X }}` (which would risk logging the secret). Empty when the secret is unset
      # (e.g. a fork PR), so the corresponding step is skipped gracefully.
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      # Accept the token under either name: the canonical KAGGLE_API_TOKEN, or a
      # fallback to KAGGLE_KEY (some setups store the KGAT_ token there). The kaggle
      # CLI authenticates from the KAGGLE_API_TOKEN env var regardless of source.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner ships with the Android SDK preinstalled at
      # $ANDROID_HOME (/usr/local/lib/android/sdk) with licenses pre-accepted. We only ensure
      # the exact platform/build-tools our build targets are present, using a direct sdkmanager
      # call (the android-actions/setup-android@v3 "packages" input mangled the package name and
      # failed with "Failed to find package 'platforms;android-35" in a prior run).
      - name: Ensure Android platform 35 + build-tools
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        # ubuntu-latest preinstalls platforms;android-35 + build-tools;35.0.0 with licenses
        # accepted, so this is a safety net only. GitHub Actions runs bash with `pipefail`, and
        # `yes | sdkmanager` exits 141 (yes gets SIGPIPE when sdkmanager closes stdin) even when
        # sdkmanager succeeded — so we tolerate non-zero here and let assembleDebug surface any
        # genuine missing-platform error with a clear message.
        run: |
          set +e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using sdkmanager: ${SDKMGR:-none}"
          [ -z "$SDKMGR" ] || yes | "$SDKMGR" --licenses > /dev/null 2>&1
          [ -z "$SDKMGR" ] || yes | "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1
          exit 0

      # Pull the TRAINED TFLite model from the private Kaggle dataset so the APK ships with a
      # real classifier instead of the untrained demo model committed in assets/. The Kaggle
      # dataset "plant-disease-xai-models" holds plant_disease.tflite (FP32, ~112 MB, Swin-Tiny,
      # 38 PlantVillage classes, 98.59% accuracy) plus labels.txt and metadata. Targeted at
      # 6GB+ RAM devices. Skipped when KAGGLE_USERNAME/KAGGLE_API_TOKEN are unset (fork PRs) -- the
      # committed demo model is then used and the build still works. NOTE: Kaggle's newer KGAT_-prefixed
      # API tokens authenticate ONLY via the KAGGLE_API_TOKEN env var, not the legacy
      # KAGGLE_USERNAME/KAGGLE_KEY split (which 403s). KAGGLE_USERNAME is kept solely for the
      # dataset slug (${KAGGLE_USERNAME}/plant-disease-xai-models).
      - name: Pull trained TFLite model from Kaggle
        if: env.KAGGLE_USERNAME != '' && env.KAGGLE_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet kaggle
          mkdir -p /tmp/kaggle-model
          kaggle datasets download -d "${KAGGLE_USERNAME}/plant-disease-xai-models" \
            -p /tmp/kaggle-model --unzip
          # Drop the trained model + labels into the assets dir, overwriting the demo model.
          # The filename MUST stay plant_disease.tflite (what InferenceModule.kt loads).
          install -m 0644 /tmp/kaggle-model/plant_disease.tflite \
            app/src/main/assets/models/plant_disease.tflite
          if [ -f /tmp/kaggle-model/labels.txt ]; then
            install -m 0644 /tmp/kaggle-model/labels.txt app/src/main/assets/models/labels.txt
          fi
          ls -la app/src/main/assets/models/
          echo "Trained model size: $(stat -c%s app/src/main/assets/models/plant_disease.tflite) bytes"

      # Decode the release keystore from KEYSTORE_BASE64. The keystore itself is never committed.
      # KEYSTORE_FILE is written to GITHUB_ENV so build.gradle.kts (which reads System.getenv)
      # attaches the release signer to the release buildType -- the direct fix for the "problem
      # parsing the package" install error on unsigned release APKs. Skipped when KEYSTORE_BASE64
      # is unset (fork PRs); the release build then stays unsigned and Gradle warns.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/leafguard-release.keystore
          echo "KEYSTORE_FILE=/tmp/keystore/leafguard-release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded: $(stat -c%s /tmp/keystore/leafguard-release.keystore) bytes"
          # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD are already in the job env from secrets,
          # so the gradle build step sees them directly.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Build the debug APK (signed with the pinned debug keystore committed at app/keystores/).
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Build the release APK. When KEYSTORE_FILE is set (keystore-decode step ran), Gradle
      # signs it with the release config; otherwise it is unsigned and Gradle warns.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Verify release APK is signed (v1 + v2 required)
        if: env.KEYSTORE_FILE != ''
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "Release APK: $APK ($(stat -c%s "$APK") bytes)"
          # --verbose prints "Verified using v1 scheme (RSA)" / "Verified using v2 scheme (...)" lines.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sigverify.txt
          # v1 is the scheme every Android installer understands. AGP 8.x omits v1 by default
          # when minSdk >= 24, producing a v2-only APK that some installers reject with
          # "There was a problem parsing the package". build.gradle.kts forces v1+v2+v3; assert it here.
          grep -q "Verified using v1 scheme" /tmp/sigverify.txt || {
            echo "FAIL: v1 (JAR) signing is MISSING — the APK is v2-only and will not install on some devices."
            exit 1
          }
          grep -q "Verified using v2 scheme" /tmp/sigverify.txt || {
            echo "FAIL: v2 signing is MISSING."
            exit 1
          }
          echo "Release APK is signed with v1 + v2 (installable on all Android 8+ installers)."

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leafguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leafguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Publish the signed release APK as a GitHub Release asset. Release assets are served as
      # RAW files (no upload-artifact ZIP wrapping), so a user downloads app-release.apk directly
      # and taps to install — no extraction step. Runs only on main pushes that produced a signed
      # release (KEYSTORE_FILE set); PRs and unsigned builds skip it. The v1.0.0 release is
      # created once and the asset is clobbered on subsequent pushes, so the "latest" APK is
      # always the most recent green build.
      - name: Publish signed APK to GitHub Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          ASSET="LeafGuard-v1.0.0-release.apk"
          cp "$APK" "$ASSET"
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            echo "Updated existing release $TAG asset."
          else
            gh release create "$TAG" "$ASSET" \
              --title "LeafGuard v1.0.0 — production release (all 8 phases)" \
              --notes "Signed production release APK (v1.0.0, all 8 phases complete). Trained Swin-Tiny model (98.59% PlantVillage accuracy, 38 classes) with occlusion-sensitivity XAI, on-device Room persistence, Dashboard/History/Records/Images, and a per-disease treatment-suggestions engine (severity tiers + staged treatments + prevention). Signed v1 + v2 + v3 — installs on all Android 8.0+ (minSdk 26) devices. Download the .apk and tap to install (no extraction needed)." \
              --target main
            echo "Created release $TAG."
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "Asset: \(.name)  \(.size) bytes  \(.url)"'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leafguard-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
            app/build/test-results/
          if-no-files-found: warn
