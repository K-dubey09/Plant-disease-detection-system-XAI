# Project-wide Gradle settings.
# Daemon heap kept at 2048m with the low-overhead serial GC so the build fits comfortably in a
# 4 GB RAM environment while leaving room for native/off-heap memory and the forked test JVM.
# Sufficient for this single-module Compose app + KSP (Hilt/Room); CI runners with more RAM are
# unaffected since the heap is an upper bound, not a reservation.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Sequential module/dependency resolution to avoid HTTP 429 from Maven Central on cold start.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Gentler HTTP behaviour for dependency downloads (helps with transient 429s).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.maxRedirects=10

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon JVM instead of forking a separate Kotlin daemon. The
# Kotlin daemon is a second full JVM (~1-2 GB) which OOMs the 4 GB sandbox alongside the Gradle
# daemon; in-process keeps it to a single JVM. No downside on CI (which has ample RAM).
kotlin.compiler.execution.strategy=in-process

# Hilt
dagger.hilt.android.gradle.useAgpVariantCandidate=false
